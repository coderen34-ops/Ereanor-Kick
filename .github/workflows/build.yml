name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: ereanor-kick
          path: target/*.jar
      - name: Jar'i jar dalina koy
        run: |
          mkdir -p /tmp/out && cp target/*.jar /tmp/out/
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan jar
          git rm -rf . -q
          cp /tmp/out/*.jar .
          git add -A
          git commit -q -m "derlenmis jar"
          git push -f origin jar
      - name: Jar'i jar dalina koy
        run: |
          mkdir -p /tmp/out && cp target/*.jar /tmp/out/
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan jar
